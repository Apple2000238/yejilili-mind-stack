name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Format / Lint ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find ops -name '*.sh' -exec shellcheck {} +
          else
            echo "shellcheck not available, skipping"
          fi
      - name: Bash syntax check
        run: |
          FAILED=0
          for f in $(find ops -name '*.sh'); do
            if ! bash -n "$f"; then
              echo "Syntax error: $f"
              FAILED=1
            fi
          done
          exit $FAILED
      - name: Python syntax check
        run: |
          FAILED=0
          for f in $(find services -name '*.py'); do
            if ! python3 -m py_compile "$f"; then
              echo "Syntax error: $f"
              FAILED=1
            fi
          done
          exit $FAILED
      - name: YAML lint
        run: |
          pip install yamllint
          yamllint docker-compose.yml
      - name: Compose config validation
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker compose config
          else
            echo "Docker not available, skipping compose validation"
          fi
        run: |
          docker compose config

  # ─── Unit / Contract Tests ──────────────────────────────────────────────────
  unit-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r services/nocturne-adapter/requirements.lock
          pip install -r services/edge-gateway/requirements.lock
          pip install -r services/migration-cli/requirements.lock
          pip install -r services/acceptance-runner/requirements.lock
          pip install -r services/continuity-guard/requirements.lock
          pip install pytest pytest-asyncio httpx
      - name: Run unit tests
        run: pytest tests/unit -v
      - name: Run contract tests
        run: pytest tests/contract -v
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            .pytest_cache/v/cache/
            reports/

  # ─── Nocturne Upstream Regression ───────────────────────────────────────────
  nocturne-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nocturne dependencies
        run: |
          pip install -r upstream/nocturne-memory-core/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run Nocturne tests
        run: |
          cd upstream/nocturne-memory-core
          python -m pytest -q --asyncio-mode=auto
      - name: Run public audit
        run: |
          cd upstream/nocturne-memory-core
          python scripts/public_audit.py

  # ─── XinChao Upstream Regression ────────────────────────────────────────────
  xinchao-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install XinChao dependencies
        run: |
          cd upstream/xinchao-dynamic-mind
          npm install
      - name: Run XinChao tests
        run: |
          cd upstream/xinchao-dynamic-mind
          npm test

  # ─── Supply Chain / Manifest Consistency ────────────────────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile uses requirements.lock
        run: |
          FAILED=0
          for f in $(find services -name Dockerfile); do
            if grep -q 'requirements\.txt' "$f"; then
              echo "ERROR: $f still references requirements.txt (should use requirements.lock)"
              FAILED=1
            fi
            if ! grep -q 'requirements\.lock' "$f"; then
              echo "ERROR: $f does not reference requirements.lock"
              FAILED=1
            fi
          done
          exit $FAILED
      - name: Check no PLACEHOLDER digests in Dockerfiles
        run: |
          FAILED=0
          for f in $(find . -name Dockerfile -not -path './.git/*'); do
            if grep -q 'PLACEHOLDER_UPDATE_BEFORE_BUILD' "$f"; then
              echo "ERROR: $f contains PLACEHOLDER digest. Run ops/update-image-digests.sh"
              FAILED=1
            fi
          done
          exit $FAILED
      - name: Check THIRD_PARTY_MANIFEST matches Dockerfiles
        run: |
          # Node version consistency
          MANIFEST_NODE=$(jq -r '.dependency_locking.node_version' THIRD_PARTY_MANIFEST.json)
          DOCKERFILE_NODE=$(grep -oE 'node:[0-9]+' upstream/xinchao-dynamic-mind/Dockerfile | head -1 | cut -d: -f2)
          if [[ "$MANIFEST_NODE" != "$DOCKERFILE_NODE" ]]; then
            echo "ERROR: THIRD_PARTY_MANIFEST node_version ($MANIFEST_NODE) != Dockerfile ($DOCKERFILE_NODE)"
            exit 1
          fi
          echo "  ✓ Node version consistent: $MANIFEST_NODE"

  # ─── Security Scan ──────────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          # 基本检查：确保没有明文密钥
          # 排除 _read_secret/os.environ.get 等安全读取模式
          grep -rE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{30,})' . \
            --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' \
            --exclude-dir=.git --exclude-dir=upstream || true
          # 额外检查 api_key = "硬编码字符串" 模式（排除函数调用和变量引用）
          grep -rP 'api[_-]?key\s*=\s*["\047][^"\047$\{]' . \
            --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' \
            --exclude-dir=.git --exclude-dir=upstream || true
          echo "Secret scan complete"
        run: |
          # 基本检查：确保没有明文密钥
          grep -rE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{30,}|api[_-]?key.*=.*[^${])' . \
            --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' \
            --exclude-dir=.git --exclude-dir=upstream
      - name: Bandit scan (Python)
        run: |
          pip install bandit
          bandit -r services/ -f json -o bandit-report.json
          cat bandit-report.json
